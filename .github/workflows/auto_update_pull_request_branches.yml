name: Auto-update pull request branches

# Every merge leaves the other open pull requests behind master, and the checks
# they show then describe a master that is gone. This workflow brings them back
# level, for the pull requests that can be updated without a conflict, so what
# a reviewer reads is the result against the master they would land on. It does
# so once master has been quiet for an hour rather than after every merge, so a
# series of merges is followed by one pass instead of one pass per merge, and
# every pass is one notification email per pull request it updates.
#
# The ones that do conflict are left alone, and each says so once in a comment
# on the pull request, which is the email that asks for a manual rebase :
# resolving a conflict is a decision only their author can make. The comment
# carries a marker, so that a later pass finds it and does not write it again,
# and the pass that finds the pull request conflict-free again deletes it, so
# that the next conflict is announced in turn. It has to be written by the
# GitHub App : GitHub does not email anyone about their own activity by default,
# so a comment written by the personal access token below, which is the
# maintainer's own identity, is not expected to reach their inbox.
#
# The quiet hour is a sleep. Every push to master starts a run, and the first
# thing a run does is wait for QUIET_PERIOD_MINUTES ; a run still asleep when the
# next push arrives is cancelled by it (the concurrency group below), and the
# new run starts its own wait. Only the run that follows the last push of a
# series ever wakes up, one quiet period after it. An hourly schedule used to do
# this job less well : GitHub runs scheduled workflows on a best-effort basis,
# and this one was measured starting every five and a half hours on average
# instead of hourly (#527). What the sleep costs instead :
#
#  * A merge made in GITHUB_TOKEN's name -- a Dependabot update, queued by
#    dependabot-auto-merge.yml, is one -- starts no workflow, so it starts no
#    wait either (that file says why this stays so). The pull requests it
#    leaves behind are brought level after the next push to master made any
#    other way. Nothing is blocked meanwhile, since master does not require a
#    branch to be up to date.
#  * The job holds its runner while it sleeps : on a hosted runner of a public
#    repository the minutes cost nothing, but one runner is occupied for the
#    whole quiet period.
#  * A run cancelled by the next push ends as "cancelled" in the Actions tab.
#    GitHub's documentation says a notification is sent for the cancelled runs
#    of a workflow one triggered, and does not say whether the "only notify for
#    failed workflows" setting leaves them out.
#
# It is best effort, and master does not require it : "Require branches to be
# up to date before merging" is off in .github/rulesets/master.json, and has to
# stay off. A pull request this cannot reach -- one that conflicts, one from a
# fork, a draft, or any of them between a Dependabot merge and the next push to
# master -- would be blocked by that setting rather than merely behind. So would
# Dependabot's own, which this leaves to Dependabot on purpose (the loop below
# says why).
#
# GitHub's own answer to this problem is the merge queue, which tests and merges
# pull requests against an up-to-date master without anyone updating anything.
# It is not an option here : it requires a repository owned by an organization,
# and this one belongs to a personal account.
#
# The update is done by rebase, which is why it goes through the GraphQL
# mutation rather than the REST "update a pull request branch" endpoint : that
# endpoint only knows how to merge the base branch into the pull request. A
# rebase replays the commits of the branch one by one, so it can hit a conflict
# on an intermediate commit even on a pull request GitHub reports as mergeable,
# because "mergeable" only ever answers for the merge. FALL_BACK_TO_MERGE below
# decides what happens then : updating with a merge commit keeps the pull
# request unblocked, which is the whole point, at the cost of a merge commit on
# that one. Set it to "false" to leave those pull requests alone instead.
#
# Rebasing force-pushes the branch, so the commits of an updated pull request
# get new SHAs : the review comments already written on it are marked outdated,
# and anyone holding a local copy of that branch has to reset onto it.
#
# /!\ The default GITHUB_TOKEN can push the update, it just gains nothing by it.
# An update that token pushes does fire "pull_request : synchronize", but the
# runs it creates are held in an approval-required state : the pull request
# shows an "Approve workflows to run" banner that somebody with write access has
# to click before the required checks even start. No repository setting turns
# that off, and swapping one click per pull request for another is not worth a
# workflow, so the update has to come from an identity GitHub already trusts.
#
# Two identities qualify, and both are wired up. Whichever is used needs the
# same three repository permissions : "Contents : read and write", "Pull
# requests : read and write" and "Workflows : read and write".
#
# That third one is the one easily forgotten : an update that would write
# anything under .github/workflows is refused without it, with "refusing to
# allow [...] to create or update workflow [...] without workflow scope
# (updatePullRequestBranch)". Granting it on an App that is already installed is
# not enough on its own, either - an installation keeps the permissions it was
# created with, so one added afterwards has to be accepted again on the
# installation page before it takes effect.
#
# That same message is also what a fork's pull request produces, for an
# unrelated reason : the credential has no permissions at all on the fork, so it
# has no "workflows" permission there either. Read it as "cannot write workflow
# files where it is being asked to" rather than as a verdict on this
# repository's own configuration. Which of the two it is can be told apart by
# where the update was headed : the warning below names the pull request, and
# whether that one comes from a fork is the answer.
#
# A GitHub App is what this repository uses, and what GitHub itself points to
# for this case. Nothing about it has to be renewed by hand, because the private
# key does not expire ; the installation token minted from it does, after an
# hour, which is why the key rather than a token is what is stored. The key goes
# into the PULL_REQUESTS_UPDATE_APP_PRIVATE_KEY secret and the App's client
# identifier into the PULL_REQUESTS_UPDATE_APP_CLIENT_ID variable, and the first
# step below mints a fresh token from them at the start of every run. That is
# the client ID shown on the App's settings page, not the App ID next to it.
#
# A fine-grained personal access token in the PULL_REQUESTS_UPDATE_TOKEN secret
# works too, and is quicker to set up : its resource owner has to be this
# account and its repository access has to cover this repository. It is what the
# credential falls back to when no App is configured, so either can be adopted,
# or swapped for the other, without this file changing. It expires, though, and
# has to be renewed by hand before it does

on:
  # Starts the wait the header describes, which the next push cancels
  push:
    branches: [master]
  # Lets the whole set be caught up by hand, without the wait : after a run
  # failed on a credential that had lapsed, after merges that started no
  # workflow, or simply to see the thing work without waiting for a merge
  workflow_dispatch:

# Everything is done with the credential above, so the token of the run itself
# needs nothing at all
permissions: {}

# A newer run cancels whatever is running or waiting in the group, and that is
# what makes the wait a wait for a quiet master : the run asleep is cancelled by
# the next push, and a pass that is still walking the pull requests when master
# moves again is cancelled too, since it is measuring against a master that is
# gone. The updates it had already pushed stand, and the next run does the rest
# after its own wait. A run started by hand joins the group like any other : it
# cancels a run that is waiting, and does its pass at once
concurrency:
  group: auto-update-pull-request-branches
  cancel-in-progress: true

jobs:
  update-pull-request-branches:
    name: Update the pull requests master left behind
    runs-on: ubuntu-latest
    # The wait and then the pass, so it has to stay above QUIET_PERIOD_MINUTES by
    # as much as a pass may take. A hosted job is cut off at six hours
    timeout-minutes: 75
    env:
      # How long master must have gone without a push before the pull requests
      # are touched
      QUIET_PERIOD_MINUTES: "60"
    steps:
      # Before the token below is minted, which lives an hour : this step takes
      # as long as the quiet period, and a token minted ahead of it could have
      # lapsed by the time it is wanted. Skipped for a run started by hand,
      # which is there to act now
      - name: Wait for master to stay quiet
        if: github.event_name == 'push'
        run: |
          echo "Waiting ${QUIET_PERIOD_MINUTES} minute(s) for master to stay quiet ; a push to master before then cancels this run and starts the wait over."
          sleep "$((QUIET_PERIOD_MINUTES * 60))"

      # Only runs once the App route is configured : without the variable there
      # is nothing to mint from, the step is skipped, and the token below falls
      # back to the personal access token. Setting the variable is the whole
      # migration, and it needs no change to this file
      - name: Mint an installation token, if a GitHub App is configured
        id: app-token
        if: vars.PULL_REQUESTS_UPDATE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PULL_REQUESTS_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PULL_REQUESTS_UPDATE_APP_PRIVATE_KEY }}

      - name: Rebase every conflict-free pull request that is behind master
        env:
          # The App's token when there is one, the personal access token
          # otherwise. Whichever it is, it needs the three permissions the
          # header describes
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PULL_REQUESTS_UPDATE_TOKEN }}
          UPDATING_AS: ${{ vars.PULL_REQUESTS_UPDATE_APP_CLIENT_ID != '' && 'the GitHub App' || 'the personal access token' }}
          REPOSITORY: ${{ github.repository }}
          # Whether a pull request whose rebase conflicts is updated with a
          # merge commit rather than left behind
          FALL_BACK_TO_MERGE: "true"
        run: |
          set -euo pipefail

          # Updates one pull request, by rebase or by merge, through the same
          # updatePullRequestBranch mutation that "gh pr update-branch" wraps.
          # expectedHeadOid pins the update to the head commit read just above,
          # so it cannot land on a commit the author pushed in the meantime.
          # The mutation is called directly rather than through gh for the error
          # message : gh reports any failure as "Cannot update PR branch due to
          # conflicts", which would misdiagnose a token missing the Workflows
          # permission as a conflict and send the reader hunting the wrong
          # thing. The log below quotes what GitHub actually said instead.
          # A GraphQL error comes back inside a 200 response, so the body has to
          # be looked at rather than only the exit status
          update_error=""
          update_pull_request() {
            local update_method="$1" pull_request_id="$2" expected_head_oid="$3"
            local response

            if ! response="$(
              gh api graphql \
                --raw-field "pullRequestId=$pull_request_id" \
                --raw-field "expectedHeadOid=$expected_head_oid" \
                --raw-field "updateMethod=$update_method" \
                --raw-field 'query=
                  mutation(
                    $pullRequestId: ID!,
                    $expectedHeadOid: GitObjectID!,
                    $updateMethod: PullRequestBranchUpdateMethod!
                  ) {
                    updatePullRequestBranch(input: {
                      pullRequestId: $pullRequestId,
                      expectedHeadOid: $expectedHeadOid,
                      updateMethod: $updateMethod
                    }) {
                      pullRequest { headRefOid }
                    }
                  }' 2>&1
            )"; then
              update_error="$(tr '\n' ' ' <<< "$response")"
              return 1
            fi

            if jq --exit-status 'has("errors")' <<< "$response" > /dev/null 2>&1; then
              update_error="$(jq --raw-output '[.errors[].message] | join(" ; ")' <<< "$response")"
              return 1
            fi

            return 0
          }

          # The comment that asks a pull request's author for a manual rebase
          # when it conflicts with master. The marker is what a later pass looks
          # for : it is why a conflict is announced once however many passes see
          # it, and how the comment is found and removed once the pull request
          # is conflict-free again. None of it ever fails the run : a comment
          # that cannot be read, written or deleted is a warning, because the
          # pull requests still have to be walked. The text is in English, like
          # the pull requests of this repository
          conflict_marker="<!-- auto-update-pull-request-branches: conflict -->"
          conflict_comment="$conflict_marker"$'\n\n'"This pull request conflicts with \`master\`, so the branch updater cannot bring it level on its own: it has to be rebased (or \`master\` merged into it) by hand. This comment is written once per conflict, and it disappears once the conflict is resolved."
          announced=0

          # The ids of the comments carrying the marker. --paginate prints one
          # JSON array per page, which jq reads as a stream
          conflict_comment_ids() {
            gh api "repos/$REPOSITORY/issues/$1/comments" --paginate |
              jq --raw-output --arg marker "$conflict_marker" '.[] | select(.body | contains($marker)) | .id'
          }

          announce_conflict() {
            local number="$1" existing

            if ! existing="$(conflict_comment_ids "$number")"; then
              echo "::warning::Pull request #$number conflicts with master, but its comments could not be read, so the conflict is not announced there."
              return 0
            fi

            if [ -n "$existing" ]; then
              return 0
            fi

            if gh api "repos/$REPOSITORY/issues/$number/comments" --raw-field "body=$conflict_comment" > /dev/null; then
              announced=$((announced + 1))
            else
              echo "::warning::Pull request #$number conflicts with master, but the comment announcing it could not be written."
            fi
          }

          forget_conflict() {
            local number="$1" existing comment_id

            # Nothing to forget is the usual case, and a failed read is not
            # worth a warning on a pull request that has no conflict
            if ! existing="$(conflict_comment_ids "$number")"; then
              return 0
            fi

            for comment_id in $existing; do
              if ! gh api --method DELETE "repos/$REPOSITORY/issues/comments/$comment_id" > /dev/null; then
                echo "::warning::Pull request #$number is conflict-free again, but the comment announcing its conflict could not be deleted."
              fi
            done
          }

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::No credential is configured, so nothing can be updated. Set either the PULL_REQUESTS_UPDATE_TOKEN secret or the PULL_REQUESTS_UPDATE_APP_CLIENT_ID variable together with the PULL_REQUESTS_UPDATE_APP_PRIVATE_KEY secret. The comment at the top of this workflow says what each one needs and why the default token is not enough."
            exit 1
          fi

          # Named in the log because the two identities fail differently, and
          # knowing which one ran is the first thing wanted when one of them does
          echo "Updating as $UPDATING_AS."

          # Master is asked for by name rather than taken from github.sha :
          # that is master's tip under the push trigger, but under
          # workflow_dispatch it is the tip of whichever ref the run was started
          # from, and the ref picker offers every branch carrying this file.
          # Measuring against the wrong base would report up-to-date pull
          # requests as behind, and skip genuinely behind ones as up to date
          master_sha="$(gh api "repos/$REPOSITORY/commits/master" --jq '.sha')"

          # Draft pull requests are skipped. They are not waiting to be merged,
          # and several of them live in forks where an unasked-for merge commit
          # after each push to master would be noise rather than help.
          # Pull requests based on another branch are skipped too : this run
          # only knows that master moved
          open_pull_requests="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --base master \
              --state open \
              --limit 100 \
              --json number,isDraft
          )"
          open_count="$(jq 'length' <<< "$open_pull_requests")"
          mapfile -t pull_requests < <(
            jq --raw-output '.[] | select(.isDraft | not) | .number' <<< "$open_pull_requests"
          )

          # Told apart, because an empty list after the draft filter is not the
          # same thing as an empty repository and saying so would be untrue
          if [ "${#pull_requests[@]}" -eq 0 ]; then
            if [ "$open_count" -eq 0 ]; then
              echo "No open pull request targets master."
            else
              echo "The $open_count open pull request(s) targeting master are all drafts, which this workflow leaves alone."
            fi
            echo "Updated 0 pull request(s)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Considering ${#pull_requests[@]} open pull request(s) against master $master_sha."

          updated=0
          for number in "${pull_requests[@]}"; do
            # GitHub computes mergeability lazily, and every push to master
            # invalidates it for every open pull request : the answer
            # is "null" until the background job that recomputes it is done, so
            # the first read is really what asks the question and the next ones
            # wait for the answer
            mergeable="null"
            head_sha=""
            node_id=""
            author=""
            for _ in 1 2 3 4 5; do
              if ! pull_request="$(gh api "repos/$REPOSITORY/pulls/$number")"; then
                break
              fi
              author="$(jq --raw-output '.user.login' <<< "$pull_request")"
              mergeable="$(jq --raw-output '.mergeable | tostring' <<< "$pull_request")"
              head_sha="$(jq --raw-output '.head.sha' <<< "$pull_request")"
              # The GraphQL mutation addresses the pull request by node ID
              node_id="$(jq --raw-output '.node_id' <<< "$pull_request")"
              # Skipped below whatever it answers, so not worth waiting for
              [ "$author" = "dependabot[bot]" ] && break
              [ "$mergeable" != "null" ] && break
              sleep 5
            done

            if [ -z "$head_sha" ]; then
              echo "::warning::Pull request #$number could not be read, skipping it."
              continue
            fi

            # Dependabot's pull requests are Dependabot's to keep level. A
            # rebase or a merge pushed by anyone else replaces the commit
            # Dependabot signed with one it did not, and
            # dependabot-auto-merge.yml's dependabot/fetch-metadata refuses a
            # commit whose signature is not Dependabot's : that job then fails
            # on the new head, and an update whose merge it had not queued yet
            # never gets it queued. Dependabot, which only resolves the
            # conflicts of a pull request nobody else has pushed to, would
            # stop resolving this one's as well.
            # Left behind, it is blocked by nothing, since master does not
            # require a branch to be up to date, and Dependabot rebases it
            # itself once it conflicts. What it gives up -- checks run against
            # the master it lands on -- is the gap dependabot-auto-merge.yml
            # already describes for the merges it makes. The identity is the
            # one the REST API gives and the one that workflow checks,
            # "dependabot[bot]", rather than whatever spelling gh uses for a
            # bot in its own output
            if [ "$author" = "dependabot[bot]" ]; then
              echo "Pull request #$number is Dependabot's, leaving it to Dependabot."
              continue
            fi

            if [ "$mergeable" = "null" ]; then
              echo "::warning::Pull request #$number : GitHub did not say in time whether it can be merged, skipping it. The next run will try again."
              continue
            fi

            if [ "$mergeable" != "true" ]; then
              echo "Pull request #$number conflicts with master, leaving it to its author."
              announce_conflict "$number"
              continue
            fi

            # A conflict announced on an earlier pass is over, and the next one
            # has to be announced afresh
            forget_conflict "$number"

            # Comparing by SHA is what lets this work for a pull request opened
            # from a fork : its branch names nothing in this repository, but its
            # head commit is mirrored here as refs/pull/<number>/head.
            # In "A...B", behind_by counts the commits A has and B does not :
            # exactly how far behind master this pull request is
            if ! behind_by="$(gh api "repos/$REPOSITORY/compare/$master_sha...$head_sha" --jq '.behind_by')" ||
               ! [[ "$behind_by" =~ ^[0-9]+$ ]]; then
              echo "::warning::Pull request #$number could not be compared with master, skipping it."
              continue
            fi

            if [ "$behind_by" -eq 0 ]; then
              echo "Pull request #$number is already up to date."
              continue
            fi

            if update_pull_request REBASE "$node_id" "$head_sha"; then
              echo "Pull request #$number was $behind_by commit(s) behind master and has been rebased on top of it."
              updated=$((updated + 1))
              continue
            fi
            rebase_error="$update_error"

            if [ "$FALL_BACK_TO_MERGE" != "true" ]; then
              echo "::warning::Pull request #$number is $behind_by commit(s) behind master and could not be rebased : $rebase_error"
              continue
            fi

            if update_pull_request MERGE "$node_id" "$head_sha"; then
              echo "::notice::Pull request #$number could not be rebased ($rebase_error), so it has been updated with a merge commit instead."
              updated=$((updated + 1))
            else
              # A pull request opened from a fork is expected to land here : the
              # update writes to the fork, and neither of the two identities
              # this workflow can use reaches one. A fine-grained token only
              # ever addresses resources owned by its own resource owner, and an
              # App installation only the repositories it is installed on, so
              # "Allow edits by maintainers" does not rescue either of them : it
              # grants the maintainer, and only a classic token acts with that
              # breadth. Those pull requests keep being updated by hand ; the
              # refusal is reported and the run carries on with the next one
              echo "::warning::Pull request #$number is $behind_by commit(s) behind master but could not be updated, neither by rebase ($rebase_error) nor by merge ($update_error). If it comes from a fork, its author has to tick \"Allow edits by maintainers\" ; otherwise it has to be updated by hand."
            fi
          done

          echo "Updated $updated pull request(s), announced $announced conflict(s)." >> "$GITHUB_STEP_SUMMARY"
