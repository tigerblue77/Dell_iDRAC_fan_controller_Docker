name: Tests

on:
  push:
    # Branches are covered by their pull request. Without this, every push to a
    # branch that has one runs the whole workflow twice, publishes the results
    # twice, and leaves a skipped "event file" check behind. Keeping master is
    # what gives the published results a baseline to compare against
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-reuse:
    name: Look for an already-tested identical tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      reuse-run-id: ${{ steps.detect.outputs.reuse-run-id }}
    steps:
      # The one checkout in this repository that keeps the credential it
      # persists : the decision step below runs "git fetch origin
      # refs/pull/<number>/head", which authenticates through it. The token is
      # read-only, and nothing from this workspace is uploaded. A fetch that
      # fails is not an error there, it falls through to "run for real", so
      # dropping the credential would not break the job, it would quietly stop
      # it saving anything. tests/cases/12_github_workflows.sh names this job
      # as the exception, and fails on any other checkout that keeps it
      - name: Checkout
        uses: actions/checkout@v7

      # A push to master that merged a pull request CAN land a tree this
      # workflow already ran to green on that same pull request, and then
      # rebuilding the Docker image and rerunning the whole suite a second time
      # on it proves nothing new -- issue #500 measured it as a wasted rerun of
      # "Tests" on every merge.
      #
      # Can, not does : master does not require a pull request to be up to
      # date before it is merged (.github/rulesets/master.json), and "Auto-update
      # pull request branches" keeps them level only as far as it can reach, so
      # one can be merged behind master, and what lands then is its changes on
      # top of commits its checks never saw. A pull request's run tests it merged
      # into master as master stood WHEN THAT RUN STARTED, so its results are
      # this commit's only if its head already contains master's tip from
      # before this push : master is never rewritten, so every master the run
      # could have seen is an ancestor of that tip, and a head containing it
      # was tested as itself. Matching trees alone do not prove it : a commit
      # that reached master while the pull request was open and was reverted
      # before this merge leaves the head's tree identical to this commit's,
      # while a run made before the revert tested the head with that commit in
      # it.
      #
      # This looks for that situation and, only when every check below holds,
      # hands "publish-test-results" the run ID to copy results from instead of
      # asking "test" and "test-in-docker-image" to redo the work :
      #   - this commit is the merge product of a specific pull request
      #   - the ref GitHub keeps for that pull request's head (which survives
      #     the head branch being deleted) still resolves to the exact head
      #     sha the API reports, and its tree is identical to this commit's
      #     (a content comparison, not a commit comparison, so it survives
      #     whichever merge strategy -- squash, merge or rebase -- produced
      #     this commit)
      #   - that head contains master's tip from before this push, for the
      #     reason above
      #   - the "Test results" check already passed on that head
      #   - a completed, successful "Tests" run for that head still has its
      #     artifacts
      #
      # A pull request merged behind master therefore runs the suite for real
      # here, and that run is where two pull requests that pass on their own
      # and fail together are caught -- after the merge rather than before it,
      # which is the price of not requiring branches to be up to date. A
      # Dependabot merge is the exception : it starts no workflow at all, see
      # dependabot-auto-merge.yml.
      #
      # Every failure mode here -- no pull request found yet (GitHub can take
      # a moment to record merge_commit_sha after a squash or rebase merge), a
      # squash edited by hand, an expired artifact, a GitHub API error -- falls
      # through to an empty output. "test" and "test-in-docker-image" read that
      # as "run for real", and so does an outright failure of this job itself :
      # nothing here can make them skip without a positive match.
      #
      # The event name and master's previous tip reach the script through its
      # environment rather than as expressions written into it, so that
      # tests/cases/12_github_workflows.sh can run it as it stands
      - name: Decide whether to reuse a pull request's results
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_MASTER_SHA: ${{ github.event.before }}
        run: |
          reuse_run_id=""

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            pr_number=$(gh api "repos/{owner}/{repo}/commits/${GITHUB_SHA}/pulls" \
              --jq ".[] | select(.merge_commit_sha == \"${GITHUB_SHA}\") | .number" 2>/dev/null \
              | head -n1) || pr_number=""

            if [[ -n "$pr_number" ]]; then
              pr_head_sha=$(gh api "repos/{owner}/{repo}/pulls/${pr_number}" --jq '.head.sha' 2>/dev/null) || pr_head_sha=""
            fi

            if [[ -n "${pr_head_sha:-}" ]] && git fetch --depth 1 origin "refs/pull/${pr_number}/head" 2>/dev/null; then
              fetched_sha=$(git rev-parse FETCH_HEAD 2>/dev/null) || fetched_sha=""
            fi

            if [[ -n "${fetched_sha:-}" && "$fetched_sha" == "$pr_head_sha" ]]; then
              head_tree=$(git rev-parse FETCH_HEAD^{tree} 2>/dev/null) || head_tree=""
              merge_tree=$(git rev-parse HEAD^{tree} 2>/dev/null) || merge_tree=""
            fi

            # In "A...B", behind_by counts the commits A has and B does not
            if [[ -n "${head_tree:-}" && "$head_tree" == "${merge_tree:-}" && -n "${PREVIOUS_MASTER_SHA:-}" ]]; then
              behind_by=$(gh api "repos/{owner}/{repo}/compare/${PREVIOUS_MASTER_SHA}...${pr_head_sha}" \
                --jq '.behind_by' 2>/dev/null) || behind_by=""
            fi

            if [[ "${behind_by:-}" == "0" ]]; then
              check_conclusion=$(gh api --paginate "repos/{owner}/{repo}/commits/${pr_head_sha}/check-runs" \
                --jq '.check_runs[] | select(.name == "Test results") | .conclusion' 2>/dev/null) || check_conclusion=""
            fi

            if [[ "${check_conclusion:-}" == "success" ]]; then
              reuse_run_id=$(gh api "repos/{owner}/{repo}/actions/workflows/tests.yml/runs?head_sha=${pr_head_sha}&event=pull_request&status=completed" \
                --jq '.workflow_runs[] | select(.conclusion == "success") | .id' 2>/dev/null | head -n1) || reuse_run_id=""
            fi
          fi

          echo "reuse-run-id=${reuse_run_id}" >> "$GITHUB_OUTPUT"

  test:
    name: Run the test suite
    needs: detect-reuse
    if: always() && needs.detect-reuse.outputs.reuse-run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Markdown summary is rendered on this job's page, the JUnit report is
      # what the publish job turns into the pull request comment
      - name: Run the test suite
        run: |
          ./tests/run_tests.sh \
            --junit test-results/on-the-runner.xml \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: Test Results (on the runner)
          path: test-results/*.xml

  test-in-docker-image:
    name: Run the test suite inside the Docker image
    needs: detect-reuse
    if: always() && needs.detect-reuse.outputs.reuse-run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the Docker image
        run: docker build --tag dell_idrac_fan_controller:test .

      # Running the suite inside the image checks the published runtime itself
      # (its bash, its GNU grep and awk) on top of the controller's behavior, and
      # runs as root, which the few test cases needing a fake /dev/ipmi device
      # skip on the runner
      - name: Run the test suite inside the image
        run: |
          mkdir -p test-results
          docker run --rm \
            --entrypoint /bin/bash \
            --volume "$PWD/tests:/app/tests:ro" \
            --volume "$PWD/test-results:/app/test-results" \
            dell_idrac_fan_controller:test \
            /app/tests/run_tests.sh \
            --junit /app/test-results/in-the-docker-image.xml \
            --summary /app/test-results/summary.md

      # Written inside the container, so it is appended to this job's summary
      # from here rather than directly
      - name: Add the test suite summary to this job's page
        if: ${{ !cancelled() }}
        run: cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: Test Results (in the Docker image)
          path: test-results/*.xml

  publish-test-results:
    name: Publish the test results
    needs: [detect-reuse, test, test-in-docker-image]
    runs-on: ubuntu-latest
    # A pull request opened from a fork runs with a read-only token, so it cannot
    # publish anything from here : the "Test results" workflow does it instead,
    # from master, once this one has finished
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    permissions:
      checks: write
      pull-requests: write
      actions: read
    steps:
      # Own run by default ; the run of the pull request whose results are
      # being reused instead, when "detect-reuse" found one
      - name: Download the test results
        uses: actions/download-artifact@v8
        with:
          pattern: Test Results (*)
          run-id: ${{ needs.detect-reuse.outputs.reuse-run-id || github.run_id }}
          github-token: ${{ github.token }}
          path: test-results

      - name: Publish the test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.xml
          check_name: Test results
          # Lists every test case in the check run, not only the failing ones,
          # so the report says what was tested and not only what broke.
          # The action only annotates the branches named by
          # check_run_annotations_branch, whose default is the default branch,
          # so without "*" the listing would be missing on every pull request,
          # which is precisely where it is read
          check_run_annotations: all tests, skipped tests
          check_run_annotations_branch: "*"

  # Kept for the "Test results" workflow : a run triggered by a fork's pull
  # request cannot read the pull request it came from, so the event that started
  # it is handed over as an artifact
  event-file:
    name: Upload the event file
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Upload the event file
        uses: actions/upload-artifact@v7
        with:
          name: Event File
          path: ${{ github.event_path }}
