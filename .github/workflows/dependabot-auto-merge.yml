name: Dependabot auto-merge

# Dependabot's minor and patch updates, every ecosystem, merge themselves once
# the checks .github/rulesets/master.json requires are green on them. Majors
# stay open for a review : they are the ones that can change behaviour. The
# same shape as wader/postfix-relay's workflow of the same name, which is the
# reference every repository of this maintainer is aligned on.
#
# What this waits on is the suite, which says nothing about whether a release can
# be trusted, so the other half of the protection is upstream of it :
# .github/dependabot.yml gives every entry a cooldown, and Dependabot does not
# propose a version until it has been published for three days. A release that
# is compromised is usually noticed within that time, and then never reaches
# this workflow at all. Security updates ignore the cooldown, see that file.
#
# "gh pr merge --auto" asks GitHub to merge LATER, once the required checks
# pass, and it is GitHub that does the waiting. Two repository settings make
# that true, and neither is a file : "Allow auto-merge" (Settings > General),
# and a ruleset or branch protection on master that requires checks.
# .github/rulesets/master.json is that ruleset, in the form "Import a ruleset"
# takes, so that the gate is something the tree states and
# tests/cases/12_github_workflows.sh can check rather than a setting believed.
#
# There is deliberately no fallback. The one this file used to carry,
# "|| gh pr merge --squash", merged straight away whenever "--auto" could not
# be enabled -- which is exactly when nothing is requiring any check, so it
# landed the update with no check having run. A pull request that cannot be
# queued now stays open, which is visible, instead of merged, which is not.
#
# Every ecosystem, not only github_actions : what decides whether an update is
# safe is the suite, which every one of these pull requests runs, and not a
# guess about which ecosystem is risky. A devcontainer feature update that
# broke something would turn the suite red and wait for a human like any other.
#
# The merge is a squash, as every pull request on master is.
#
# /!\ The merge is made in GITHUB_TOKEN's name, and a push made with that token
# starts no workflow : after a Dependabot update lands, "Tests" and
# "Shellcheck" do not rerun on master, and "Auto-update pull request branches"
# starts no wait either, so it only reaches the pull requests left behind after
# the next push to master made any other way. What the required checks passed
# is the update merged into master as master stood when they ran, and master
# does not require a branch to be up to date before it is
# merged. So when something else reached master in between, the tree that lands
# is one no check ran on, and it stays that way until the suite next runs over a
# tree that contains it : on a pull request that workflow brings level with
# master, on the next merge made by a person, or on a manual run of "Tests".
# Only a credential other than GITHUB_TOKEN would make the merge start
# workflows, and Dependabot-triggered runs only see Dependabot secrets, so the
# App credential that workflow uses would have to be stored there as well -- a
# choice, not an oversight.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Queue minor and patch Dependabot updates for auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
