name: Docker image CI

on:
  push:
    tags: ["v[0-9]+.[0-9]+"]
    paths-ignore:
      - "**/README.md"
  # Lets a release build be re-fired from the Actions tab against a tag that
  # already exists, instead of having to delete and re-push it
  workflow_dispatch:

# Without this block the whole workflow runs on the repository-wide default
# token. This one grants only what its two publishing steps need : "contents"
# for the GitHub release "Generate release note" creates, "packages" for the
# image pushed to ghcr.io. Everything else the default token may carry
# (issues, pull requests, deployments...) is dropped
permissions:
  contents: write
  packages: write

jobs:
  # The Tests workflow runs on push and pull_request, neither of which fires on
  # a version tag : without this job a release would be built and published
  # without a single test having run on the commit being released
  test:
    name: Run the test suite before publishing
    runs-on: ubuntu-latest
    # Reading the repository is all this job does ; publishing keeps the
    # workflow's default token
    permissions:
      contents: read
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the test suite
        run: ./tests/run_tests.sh --summary "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and publish Docker image to Docker Hub and GitHub Containers Repository
    runs-on: ubuntu-latest
    # Nothing is published unless the suite passed on the tagged commit
    needs: [test]
    # The workflow_dispatch ref dropdown offers branches too. Publishing an image
    # built from a branch would move "latest" onto unreleased code, so only run
    # when the ref is a version tag
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Whether this tag gets "latest" is decided by comparing it against every
          # other tag, which the default single-commit fetch does not bring along
          fetch-depth: 0

      - name: Calculate final Docker image name
        id: docker_image_name
        run: |
          IMAGE_NAME="${{ github.repository }}"
          FINAL_NAME="${IMAGE_NAME/_Docker/}"
          echo "value=$FINAL_NAME" >> $GITHUB_OUTPUT

      # Builds can run concurrently and old tags can be rebuilt on demand, so the
      # order in which images reach the registry says nothing about their version.
      # Only the highest version tag may claim "latest"
      - name: Check whether this tag is the highest version
        id: highest_version
        run: |
          # sort -V, not sort : lexicographically "v1.9" sorts above "v1.19"
          HIGHEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*' | sort -V | tail -1)"
          if [ "$HIGHEST_TAG" = "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME is the highest version tag, it will be published as 'latest'"
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "$GITHUB_REF_NAME is behind $HIGHEST_TAG, 'latest' will be left untouched"
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Recorded as a label below. The "Base image refresh" workflow reads it
      # back off the published image to tell whether the base moved since, so
      # an image published here has to carry it too : without it that workflow
      # would rebuild once for nothing after every release.
      # Sits between the logins and "Docker meta" on purpose : it consumes the
      # former because the base lives on Docker Hub, where requests are rate
      # limited and anonymous ones are limited per IP on shared runner
      # addresses, and the latter consumes its outputs
      - name: Resolve the digest of the base image
        id: base
        run: |
          set -euo pipefail
          BASE_IMAGE="$(awk 'toupper($1) == "FROM" { print $2; exit }' Dockerfile)"
          echo "image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          # Docker Hub answers 429 once the pull quota for the current window is
          # spent, and every request this workflow makes there counts against
          # it : this one, and the two the build below makes to load the base
          # metadata for amd64 and arm64. Retrying rides out the short spikes,
          # a quota that is genuinely exhausted outlives the waits and fails
          # the run, which is the honest outcome
          for DELAY in 60 300 0; do
            if DIGEST="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')"; then
              echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$DELAY" -gt 0 ]; then
              echo "::warning::Could not resolve $BASE_IMAGE, retrying in ${DELAY}s"
              sleep "$DELAY"
            fi
          done
          echo "::error::Could not resolve the digest of $BASE_IMAGE"
          exit 1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # The two entries below are docker.io/tigerblue77/dell_idrac_fan_controller
          # and ghcr.io/tigerblue77/dell_idrac_fan_controller. Said here rather than
          # at the end of each line : from v6 on the action only strips a "#" that
          # starts a line, so a trailing note would be read as part of the image name
          images: |
            ${{ steps.docker_image_name.outputs.value }}
            ghcr.io/${{ steps.docker_image_name.outputs.value }}
          # github.ref_name is the tag name on both the push and the workflow_dispatch
          # paths, whereas "type=ref,event=tag" only resolves on a push tag event and
          # would leave a dispatched run with no tag at all
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ steps.highest_version.outputs.value == 'true' }}
          # The explicit "latest" entry above is the only thing that may publish it,
          # gated on the highest version check. latest=auto is already inert for
          # type=raw entries - procRaw() hardcodes latest=false under auto - so this
          # pins that behaviour rather than changing it, and keeps it pinned should a
          # type=semver or type=ref entry ever be added here
          flavor: |
            latest=false
          # The licences entry is spelled out rather than left to the action.
          # metadata-action fills org.opencontainers.image.licenses on its own,
          # from whatever GitHub's licence detection reports for the repository,
          # and every label it emits is handed to build-push-action as a --label,
          # which wins over the LABEL lines in the Dockerfile. So the identifier
          # the released image carries would be GitHub's guess, not the project's
          # own statement of its terms, and GitHub reports the plain "AGPL-3.0"
          # rather than the "-only" the project actually chose. Stating it here
          # is what makes the two agree, and what keeps a licence change a matter
          # of editing this repository rather than of waiting for a scanner to
          # notice. See LICENSE, and LICENSE-COMMERCIAL.md for the other arm --
          # which is deliberately absent, being negotiated per licensee instead
          # of attached to a public artefact
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.base.name=${{ steps.base.outputs.image }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # docker/build-push-action carries no retry of its own, and a 429 kills
      # the build in its first second, on the metadata of the base image,
      # before a single layer moves. One more attempt, far enough apart to
      # outlast a spike
      - name: Build and publish Docker image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for the registry before retrying
        if: steps.build.outcome == 'failure'
        run: sleep 300

      # Same inputs as the attempt above, deliberately : this is that step
      # again, not a different build. Should the first attempt have died with
      # some of its layers already pushed, pushing the same tags a second time
      # is what a re-fired release does today and the registries take it fine
      - name: Retry building and publishing Docker image
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Last, where it used to sit right after the checkout : a release note is
      # the announcement that a version is out, and announcing it before the
      # image was pushed is what left seventeen versions, v1.50 and most of
      # v1.52 to v1.69, behind a GitHub release with nothing to pull from
      # either registry. Published only once the push went through, a release
      # that fails simply does not exist, and re-firing the workflow from the
      # Actions tab publishes it for real : re-firing a tag that already has a
      # release updates that release in place, so recovering them costs nothing
      - name: Generate release note
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
