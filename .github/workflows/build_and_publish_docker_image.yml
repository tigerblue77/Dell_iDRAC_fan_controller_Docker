name: Docker image CI

on:
  push:
    tags: ["v[0-9]+.[0-9]+"]
    paths-ignore:
      - "**/README.md"
  # Lets a release build be re-fired from the Actions tab against a tag that
  # already exists, instead of having to delete and re-push it
  workflow_dispatch:

jobs:
  build:
    name: Build and publish Docker image to Docker Hub and GitHub Containers Repository
    runs-on: ubuntu-latest
    # The workflow_dispatch ref dropdown offers branches too. Publishing an image
    # built from a branch would move "latest" onto unreleased code, so only run
    # when the ref is a version tag
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate release note
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true

      - name: Calculate final Docker image name
        id: docker_image_name
        run: |
          IMAGE_NAME="${{ github.repository }}"
          FINAL_NAME="${IMAGE_NAME/_Docker/}"
          echo "value=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Recorded as a label below. The "Base image refresh" workflow reads it
      # back off the published image to tell whether the base moved since, so
      # an image published here has to carry it too : without it that workflow
      # would rebuild once for nothing after every release.
      # Placed after the Docker Hub login on purpose : the base lives there, and
      # anonymous requests are rate limited per IP on shared runner addresses.
      # A step that can fail sits between a published release and a pushed
      # image, so it had better not be one that fails for lack of credentials
      - name: Resolve the digest of the base image
        id: base
        run: |
          set -euo pipefail
          BASE_IMAGE="$(awk 'toupper($1) == "FROM" { print $2; exit }' Dockerfile)"
          echo "image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.docker_image_name.outputs.value }} # docker.io/tigerblue77/dell_idrac_fan_controller
            ghcr.io/${{ steps.docker_image_name.outputs.value }} # ghcr.io/tigerblue77/dell_idrac_fan_controller
          # github.ref_name is the tag name on both the push and the workflow_dispatch
          # paths, whereas "type=ref,event=tag" only resolves on a push tag event and
          # would leave a dispatched run with no tag at all
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.base.name=${{ steps.base.outputs.image }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
