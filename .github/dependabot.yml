# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Majors come one PR each and sit there until reviewed, so they fill the
    # queue. The default limit is 5, and the first scan hit it exactly : five
    # majors were raised, the rest were never mentioned again. Raising it is
    # what keeps an action from ageing out of sight behind a full queue
    open-pull-requests-limit: 10
    groups:
      # Minor and patch updates are grouped into a single PR,
      # auto-merged by the dependabot-auto-merge workflow.
      # Major updates stay out of the group: one separate PR each,
      # waiting for manual review (potentially breaking changes).
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
