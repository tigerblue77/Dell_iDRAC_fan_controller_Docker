# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
    # Seven days before a new version is proposed, for the reason given on the
    # entry below, which holds here too
    cooldown:
      default-days: 7
    # The limit counts per entry, so the reason given on the entry below holds
    # here too
    open-pull-requests-limit: 99
    # Grouped the same way and for the same reason as the entry below : minor
    # and patch updates merge themselves once the suite is green, majors wait
    groups:
      devcontainers-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Daily rather than weekly : minor and patch updates are grouped and
    # auto-merged, so checking every day shortens the delay before a fix lands
    # without adding review work. Major updates are opened sooner too, they
    # still wait for a manual review
    schedule:
      interval: "daily"
    # A version is proposed only once it has been published for seven days.
    # Dependabot already waits three days when no cooldown is configured, and
    # that default is what applied here until this entry named a number : seven
    # asks for more, and it is the one number to edit if it turns out to be too
    # many. Minor and patch updates merge themselves once the suite is green, and
    # the suite says nothing about whether a release can be trusted. A
    # compromised one is usually noticed and pulled within days, so a longer wait
    # is more of that window, at the price of running a week behind. The daily
    # check above still applies, so a version is proposed the day after its
    # cooldown ends.
    # It holds for version updates only : a security update is never delayed, and
    # a fix for a published vulnerability still arrives at once. Only
    # default-days exists for this ecosystem, the semver-*-days options are for
    # the semver ones, pip for instance. Majors are held back by the same seven
    # days, they wait for a review anyway.
    # No entry here is left without one, and leaving it out would not exempt it :
    # an entry with no cooldown gets Dependabot's three days. The base image of
    # the Dockerfile is not tracked by Dependabot at all, base_image_refresh.yml
    # rebuilds on it every night, so the entry that would want an exemption, an
    # official base image whose freshness matters more than the delay, does not
    # exist. If one is ever added, its dependency goes in the cooldown's exclude
    # list, and tests/cases/12_github_workflows.sh is where an entry that is
    # deliberately left on the default is named
    cooldown:
      default-days: 7
    # Opening a pull request is the only way Dependabot reports anything, and it
    # stops opening them once this many are waiting - silently, naming nothing.
    # The default is 5, and the first scan here hit it exactly : five majors
    # were raised, the rest were never mentioned again. Majors come one pull
    # request each and sit until reviewed, so the queue fills easily.
    # 99, not 0 : zero does not mean "no limit", it disables version updates
    # altogether and leaves only security ones. A large value is what the
    # documentation gives as the way to effectively remove the limit
    open-pull-requests-limit: 99
    groups:
      # Minor and patch updates are grouped into a single PR,
      # auto-merged by the dependabot-auto-merge workflow.
      # Major updates stay out of the group: one separate PR each,
      # waiting for manual review (potentially breaking changes).
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
